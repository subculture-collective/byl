# Local development stack. Default: Postgres + API with straight-line routing,
# no narration, and filesystem media. Optional profiles:
#   --profile media     adds MinIO (set MEDIA_STORE=s3 and the S3_* vars)
#   --profile routing   adds Valhalla with an Illinois extract (set ROUTING_PROVIDER=valhalla)
services:
  postgres:
    image: postgres:16-alpine
    networks:
      museum_net:
        aliases:
          - postgres
          - invisible-museum-postgres
    environment:
      POSTGRES_DB: invisible_museum
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: museum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum -d invisible_museum"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: gomicro/goose:3.24.1
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://museum:museum@invisible-museum-postgres:5432/invisible_museum?sslmode=disable
    networks:
      - museum_net
    volumes:
      - ./migrations:/migrations
    command: ["goose", "-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: "postgres://museum:museum@invisible-museum-postgres:5432/invisible_museum?sslmode=disable"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-admin@example.com}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-2160}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-straightline}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      NARRATION_PROVIDER: ${NARRATION_PROVIDER:-none}
      NARRATION_BASE_URL: ${NARRATION_BASE_URL:-https://api.openai.com}
      NARRATION_API_KEY: ${NARRATION_API_KEY:-}
      NARRATION_MODEL: ${NARRATION_MODEL:-gpt-4o-mini-tts}
      NARRATION_VOICE: ${NARRATION_VOICE:-alloy}
      MEDIA_STORE: ${MEDIA_STORE:-fs}
      MEDIA_FS_DIR: /data/media
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_BUCKET: ${S3_BUCKET:-museum-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-museum}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-museum-secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LOCAL_ARCHIVE_URLS: ${LOCAL_ARCHIVE_URLS:-}
      SOURCES_USER_AGENT: ${SOURCES_USER_AGENT:-InvisibleMuseum/0.2 (+https://github.com/subculture-collective/byl)}
      SOURCES_ALLOW_PRIVATE_HOSTS: ${SOURCES_ALLOW_PRIVATE_HOSTS:-false}
      JOB_WORKERS: ${JOB_WORKERS:-2}
    networks:
      - museum_net
    ports:
      - "8080:8080"
    volumes:
      - media_data:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      API_UPSTREAM: http://api:8080
    networks:
      - museum_net
    ports:
      - "3000:80"
    depends_on:
      - api

  minio:
    image: minio/minio:latest
    profiles: ["media"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-museum}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-museum-secret}
    networks:
      - museum_net
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    profiles: ["routing"]
    environment:
      # First start downloads the extract and builds tiles; this takes a while and several GB.
      tile_urls: https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
    networks:
      - museum_net
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files

volumes:
  postgres_data:
  media_data:
  minio_data:
  valhalla_tiles:

networks:
  museum_net:
