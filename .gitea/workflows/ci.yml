name: CI
'on':
  push:
    branches:
    - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every run deploys main; never cancel a deployment part-way.
  cancel-in-progress: false

jobs:
  verify:
    name: Backend quality
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: "1.25"
        cache: true
        cache-dependency-path: backend/go.sum
    - name: Verify backend modules and vet
      shell: bash
      run: |-
        go mod verify
        go vet ./...
      working-directory: backend
    - name: Check formatting
      shell: bash
      run: test -z "$(gofmt -l .)"
      working-directory: backend
    - name: Test backend
      shell: bash
      run: |-
        # This disposable database skips durability writes; all migrations still run per schema.
        # Record its ID because Gitea does not populate job.services.postgres.id.
        postgres_id="$(docker run --detach --network bridge --cpus=1 --memory=1g -e POSTGRES_USER=museum -e POSTGRES_PASSWORD=museum -e POSTGRES_DB=museum_test postgres:16-alpine -c fsync=off -c synchronous_commit=off -c full_page_writes=off)"
        cleanup() {
          status=$?
          if [ "$status" -ne 0 ]; then
            docker logs "$postgres_id" >&2 || true
          fi
          docker rm --force --volumes "$postgres_id" >/dev/null || true
        }
        trap cleanup EXIT
        postgres_host="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$postgres_id")"
        test -n "$postgres_host"
        for attempt in {1..30}; do
          if docker exec "$postgres_id" pg_isready -h 127.0.0.1 -U museum -d museum_test >/dev/null; then
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo 'Test database did not become ready' >&2
            exit 1
          fi
          sleep 1
        done
        TEST_DATABASE_URL="postgres://museum:museum@$postgres_host:5432/museum_test?sslmode=disable" go test -count=1 -timeout 20m ./...
      working-directory: backend
    - name: Build backend
      shell: bash
      run: go build ./...
      working-directory: backend
  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - name: Verify selected BYL assets and generated native palettes
      run: python3 scripts/sync-byl.py --check && python3 scripts/generate-byl-palette.py --check && python3 scripts/build-pilot-content.py --check
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/package-lock.json
    - uses: actions/setup-go@v6
      with:
        go-version: "1.25"
        cache: true
        cache-dependency-path: backend/go.sum
    - name: Install
      shell: bash
      run: npm install -g npm@11 && npm ci --legacy-peer-deps
      working-directory: web
    - name: Check, lint, unit test, build
      shell: bash
      run: |-
        npm run gen:api
        npm run check
        npm run lint
        npm run test:unit -- --run
        npm run build
      working-directory: web
    - name: Install browser
      run: npx playwright install --with-deps chromium
      working-directory: web
    - name: Test visitor and curator flows against an isolated API
      run: bash scripts/test-web-e2e.sh
  android:
    name: Android core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Test Kotlin core with pinned Gradle and JDK
      run: bash scripts/test-android-core-container.sh
  ios:
    name: iOS build and package tests
    runs-on: macos
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Test shared Swift package
      run: swift test
      working-directory: ios-invisible-museum/InvisibleMuseumKit
    - name: Build unsigned iOS app
      run: xcodebuild -quiet -project InvisibleMuseum.xcodeproj -scheme InvisibleMuseum -sdk iphoneos -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/invisible-museum-ios" CODE_SIGNING_ALLOWED=NO build
      working-directory: ios-invisible-museum
  release:
    name: Release images and deploy
    needs: [verify, web, android, ios]
    # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
    runs-on: [ubuntu-latest, kvant]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Check release automation syntax
      run: |
        bash -n scripts/release.sh scripts/smoke-release.sh scripts/byl-pre-deploy.sh
        python3 -c 'from pathlib import Path; [compile(p.read_text(), str(p), "exec") for p in (Path("scripts/verify_release.py"), Path("scripts/publish-release.py"))]'
    - name: Build and smoke-test release images
      if: github.event_name == 'pull_request'
      env:
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      run: bash scripts/release.sh
    - name: Build, verify and deploy current main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        DEPLOY: 'true'
        HOMELAB_DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
        HOMELAB_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
      run: bash scripts/release.sh
    - name: Publish successful deployment as a Gitea release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      run: python3 scripts/publish-release.py
